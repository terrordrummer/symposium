[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "symposium"
version = "1.5.0"
description = "Reference implementation of the Symposium protocol — structured, sequential, adversarial multi-agent deliberation."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Roberto Sartori" }]
requires-python = ">=3.11"
keywords = [
  "ai-agents",
  "deliberation",
  "json-schema",
  "llm",
  "multi-agent",
  "protocol",
  "reasoning",
  "specification",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "pydantic>=2.7",
  "click>=8.1",
  "PyYAML>=6.0",
  "jsonschema>=4.26",
  "referencing>=0.35",
  "rfc8785>=0.1.4",
  "httpx>=0.27",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "respx>=0.21",
]

[project.urls]
Homepage = "https://github.com/terrordrummer/symposium"
Specification = "https://github.com/terrordrummer/symposium/blob/main/docs/specification.md"
Repository = "https://github.com/terrordrummer/symposium"

[project.scripts]
symposium = "symposium.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["symposium"]

[tool.hatch.build.targets.sdist]
include = [
  "/symposium",
  "/docs/specification.md",
  "/docs/repository-strategy.md",
  "/docs/schemas/v1.0.0",
  "/examples",
  "/tests",
  "/README.md",
  "/LICENSE",
  "/pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
