name: release

# Runs when a version tag is pushed. Always builds the dists and creates a
# GitHub Release with them attached (works with the built-in token, no
# external setup). It additionally attempts a PyPI publish via Trusted
# Publishing (OIDC) under the `pypi` environment — that step is best-effort
# (`continue-on-error`) so a not-yet-configured publisher does not fail the
# release; configure the publisher on PyPI and re-run this job to publish.
#
#   git tag v1.5.0 && git push origin v1.5.0
on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build

      - name: Verify tag matches package version
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          tag="${REF_NAME#v}"
          pkg="$(python -c "import tomllib, pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")"
          echo "tag=$tag pyproject=$pkg"
          test "$tag" = "$pkg" || { echo "::error::tag v$tag does not match pyproject version $pkg"; exit 1; }

      - name: Check distribution metadata
        run: twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  github-release:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Create / update GitHub Release with artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

  publish-pypi:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    # Best-effort: a not-yet-configured Trusted Publisher must not fail the
    # release. Configure it on PyPI, then re-run this job to publish.
    continue-on-error: true
    environment:
      name: pypi
      url: https://pypi.org/project/symposium-protocol/
    permissions:
      id-token: write  # OIDC token for PyPI Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
