name: validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  schemas:
    name: schemas (positive + negative)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "jsonschema>=4.26" "referencing>=0.35" "rfc8785>=0.1.4"

      - name: Run positive validator (28 cases)
        working-directory: docs/schemas/v1.0.0/examples
        run: python3 validate.py

      - name: Run negative validator (36 cases)
        working-directory: docs/schemas/v1.0.0/examples
        run: python3 validate_negative.py

  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: |
          python -m pip install --upgrade pip
          pip install "ruff>=0.15,<0.16"

      - name: Run ruff
        run: ruff check .

  typecheck:
    name: mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package + mypy
        run: |
          python -m pip install --upgrade pip
          pip install -e . "mypy>=1.11"

      # Config lives in pyproject.toml ([tool.mypy]); the gate checks the
      # whole symposium package with check_untyped_defs.
      - name: Run mypy
        run: python -m mypy

  python-tests:
    name: python reference impl (pytest)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package + test extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Run pytest
        run: pytest -q --cov=symposium --cov-fail-under=75
