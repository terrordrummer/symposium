# OpenAI-backed session config. Drives a real-API session against
# `https://api.openai.com/v1/chat/completions` via the built-in
# OpenAIProvider adapter (§6.12).
#
# Prerequisites:
#   - Export OPENAI_API_KEY before invoking `symposium run`. The adapter
#     fails fast at construction time (§6.8) if the variable is missing.
#   - Optional: export OPENAI_BASE_URL to point at a self-hosted
#     OpenAI-compatible endpoint.
#
# Run:
#   export OPENAI_API_KEY=sk-...
#   symposium run --config examples/configs/openai.yaml examples/problem.md
#
# Persona refs are built-in IDs resolved at load time by
# `symposium.personas.persona_by_id`. Vendor strings (`openai`,
# `gpt-4o-mini`, etc.) live in this config — they MUST NOT appear in
# the spec body or schema fields (rule N4).

schema_version: "1.0.0"
session_id: "demo-openai-001"
originator: "user"
problem_statement: |
  Should we adopt a structured deliberation protocol for AI agent
  collaboration, or continue with ad-hoc group-chat orchestration?

selector:
  strategy: "fixed"
  default_deliberation_panel:
    - logician
    - visionary
    - researcher
    - critic
    - engineer
  coordinator_agent: "coordinator"

agents:
  - id: logician
    persona_ref: logician
    provider: openai
    model: gpt-4o-mini
  - id: visionary
    persona_ref: visionary
    provider: openai
    model: gpt-4o-mini
  - id: researcher
    persona_ref: researcher
    provider: openai
    model: gpt-4o-mini
  - id: critic
    persona_ref: critic
    provider: openai
    model: gpt-4o-mini
  - id: engineer
    persona_ref: engineer
    provider: openai
    model: gpt-4o-mini

coordinator:
  id: coordinator
  persona_ref: coordinator
  provider: openai
  model: gpt-4o-mini

budget:
  max_total_tokens: 200000
  max_total_cost_usd: 2.50
  max_rounds: 4
  max_wallclock_seconds: 300

runtime:
  max_branch_depth: 1
  max_deferred_queue_length: 8
  max_deferred_drains_per_round: 1
  on_agent_failure: "terminate"
  per_agent_retry_budget: 2
  on_budget_exceeded: "stop"
  observability_level: "mvp"
  max_tool_iterations: 8
